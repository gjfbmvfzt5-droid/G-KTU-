<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b3a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Taşeron Takip"><title>Taşeron Evrak Takip</title><style>:root{--navy:#172b3a;--blue:#315979;--gold:#e6a23c;--bg:#f5f4ef;--card:#fff;--line:#ddd8cc;--muted:#6b7280;--green:#2f7a4d;--red:#bf3b34}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b3a;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}.title{font-size:19px;font-weight:750}.sub{font-size:11px;color:#b9c7d1;margin-top:2px}.tabs{display:flex;gap:7px;margin-top:12px;overflow:auto}.tab{border:1px solid #456072;background:#213b4d;color:#dce6ed;border-radius:10px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab.on{background:var(--gold);border-color:var(--gold);color:#172b3a}.wrap{padding:13px 12px 80px;max-width:900px;margin:auto}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}.btn{border:1px solid #bcb6a9;background:#fff;border-radius:10px;padding:10px 12px;font-weight:650;color:#172b3a}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red);border-color:#e5b7b4}.companies{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.company{min-width:180px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:left}.company.on{border:2px solid var(--gold);padding:10px}.company b{display:block}.small{font-size:11px;color:var(--muted);margin-top:4px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.metric strong{font-size:25px;display:block}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase}.section-title{font-size:15px;font-weight:750;margin:18px 2px 8px}.doc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px}.docname{font-weight:650;margin-bottom:8px}.status{border-radius:9px;border:1px solid;padding:8px 10px;font-size:11px;font-weight:800}.status.yok,.status.expired{color:var(--red);border-color:var(--red);background:#fbeae9}.status.var{color:var(--green);border-color:var(--green);background:#e7f2ec}.status.expiring{color:#9b681b;border-color:#c4831f;background:#fcf2e0}.date{border:1px solid var(--line);border-radius:9px;padding:8px;background:#faf9f6;max-width:160px}.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.person h3{margin:0 0 10px;font-size:15px}.pdoc{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eee}.pdoc:first-of-type{border-top:0}.pdate{grid-column:1/-1;border:1px solid var(--line);border-radius:9px;padding:7px;width:100%}.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;background:#fff}.empty{text-align:center;color:var(--muted);padding:25px 10px}.modalbg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}.modal{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.modal input{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.hidden{display:none}@media(min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}.modalbg{align-items:center;justify-content:center}.modal{max-width:420px;border-radius:18px}}</style></head><body><header class="head"><div class="title">Taşeron Evrak Takip</div><div class="sub">Kurumsal İSG Kontrol · Mobil</div><div id="tabs" class="tabs"></div></header><main class="wrap"><div class="row between"><b id="entityName"></b><button class="btn primary" id="addCompany">+ Firma</button></div><div id="companies" class="companies"></div><div id="main"></div></main><div id="modal" class="modalbg hidden"><div class="modal"><b id="modalTitle"></b><input id="modalInput" placeholder="Bilgi girin"><div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Vazgeç</button><button class="btn primary" id="save">Kaydet</button></div></div></div><script>(()=>{const ENT={sanko:{name:'SANKO HOLDİNG',warn:30,seed:['AKKUŞ İZOLASYON','ATASOYU YAPI','DAŞMAR İNŞAAT','KARADENİZLİLER VİNÇ','UYSAL TİCARET']},isko:{name:'ISKO',warn:45,seed:[]},reup:{name:'RE&UP',warn:60,seed:[]}};const C=[['isg','İş Güvenliği Uzmanı Ataması',1],['hekim','İşyeri Hekimi Ataması',1],['risk','Risk Değerlendirme Raporu',1],['acil','Acil Durum Eylem Planı',1]];const P=[['sgk','SGK Girişi',0],['saglik','Sağlık Raporu',1],['egitim','İSG Eğitimi',1],['yuksek','Yüksekte Çalışma Eğitimi',1],['myk','Mesleki Yeterlilik Belgesi',1],['operator','Operatör Belgesi',1],['kkd','KKD Zimmet Tutanağı',0],['gorev','Geçici Görevlendirme Yazısı',0]];const id=()=>Math.random().toString(36).slice(2,10),empty=a=>Object.fromEntries(a.map(x=>[x[0],{status:'yok',expiry:''}])),mk=n=>({id:id(),name:n,created:new Date().toISOString().slice(0,10),corp:empty(C),people:[]});let entity='sanko',active=null,mode=null,data={};for(const k in ENT){try{data[k]=JSON.parse(localStorage.getItem('tt:'+k))||ENT[k].seed.map(mk)}catch(e){data[k]=ENT[k].seed.map(mk)}}active=data.sanko[0]?.id||null;const $=s=>document.querySelector(s),saveData=()=>{try{localStorage.setItem('tt:'+entity,JSON.stringify(data[entity]))}catch(e){}};function der(d,ex){if(d.status==='yok')return'yok';if(ex&&d.expiry){let x=Math.round((new Date(d.expiry+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/864e5);if(x<0)return'expired';if(x<=ENT[entity].warn)return'expiring'}return'var'}const label=s=>({var:'VAR',yok:'YOK',expired:'SÜRESİ DOLDU',expiring:'YAKLAŞIYOR'})[s];function stat(c){let t=0,o=0,x=0,e=0;C.forEach(d=>{t++;let s=der(c.corp[d[0]],d[2]);if(s==='var')o++;if(s==='expiring')x++;if(s==='expired')e++});c.people.forEach(p=>P.forEach(d=>{t++;let s=der(p.docs[d[0]],d[2]);if(s==='var')o++;if(s==='expiring')x++;if(s==='expired')e++}));return{pct:t?Math.round(o/t*100):100,issues:t-o,x,e}}function render(){let tabs=$('#tabs');tabs.innerHTML=Object.keys(ENT).map(k=>`<button class="tab ${k===entity?'on':''}" data-e="${k}">${ENT[k].name}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{entity=b.dataset.e;active=data[entity][0]?.id||null;render()});$('#entityName').textContent=ENT[entity].name;let cs=$('#companies');cs.innerHTML=data[entity].map(c=>{let s=stat(c);return`<button class="company ${c.id===active?'on':''}" data-id="${c.id}"><b>${c.name}</b><div class="small">${c.people.length} personel · ${s.issues} eksik · %${s.pct}</div></button>`}).join('');cs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});let c=data[entity].find(x=>x.id===active);if(!c){$('#main').innerHTML='<div class="empty">Bu grupta taşeron kaydı yok.</div>';return}let s=stat(c);$('#main').innerHTML=`<div class="card"><div class="row between"><div><b style="font-size:19px">${c.name}</b><div class="small">Kayıt: ${c.created} · ${c.people.length} personel</div></div><button class="btn danger" id="delCompany">Firmayı Sil</button></div></div><div class="metrics"><div class="metric"><strong>%${s.pct}</strong><span>Uyum Oranı</span></div><div class="metric"><strong>${s.issues}</strong><span>Eksik / Sorunlu</span></div><div class="metric"><strong>${s.x}</strong><span>Süresi Yaklaşan</span></div><div class="metric"><strong>${s.e}</strong><span>Süresi Dolmuş</span></div></div><div class="section-title">Kurumsal Belgeler</div><div id="corp"></div><div class="row between" style="margin-top:18px"><div class="section-title" style="margin:0">Personel Belgeleri</div><button class="btn primary" id="addPerson">+ Personel</button></div><input id="search" class="search" placeholder="Personel ara…" style="margin:9px 0"><div id="people"></div>`;$('#delCompany').onclick=()=>{if(confirm('Firma ve tüm kayıtları silinsin mi?')){data[entity]=data[entity].filter(x=>x.id!==c.id);active=data[entity][0]?.id||null;saveData();render()}};$('#addPerson').onclick=()=>open('person');$('#search').oninput=()=>people(c);corp(c);people(c)}function corp(c){$('#corp').innerHTML=C.map(d=>{let o=c.corp[d[0]],s=der(o,d[2]);return`<div class="doc"><div class="row between"><div class="docname">${d[1]}</div><button class="status ${s}" data-k="${d[0]}">${label(s)}</button></div>${d[2]?`<input type="date" class="date" data-d="${d[0]}" value="${o.expiry}">`:''}</div>`}).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let o=c.corp[b.dataset.k];o.status=o.status==='var'?'yok':'var';saveData();render()});document.querySelectorAll('[data-d]').forEach(i=>i.onchange=()=>{let o=c.corp[i.dataset.d];o.expiry=i.value;if(i.value)o.status='var';saveData();render()})}function people(c){let q=($('#search')?.value||'').toLocaleLowerCase('tr'),a=c.people.filter(p=>p.name.toLocaleLowerCase('tr').includes(q));$('#people').innerHTML=a.length?a.map(p=>`<div class="person"><div class="row between"><h3>${p.name}</h3><button class="btn danger" data-del="${p.id}">Sil</button></div>${P.map(d=>{let o=p.docs[d[0]],s=der(o,d[2]);return`<div class="pdoc"><span>${d[1]}</span><button class="status ${s}" data-p="${p.id}|${d[0]}">${label(s)}</button>${d[2]?`<input type="date" class="pdate" data-pd="${p.id}|${d[0]}" value="${o.expiry}">`:''}</div>`}).join('')}</div>`).join(''):'<div class="empty">Personel kaydı bulunmuyor.</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let[z,k]=b.dataset.p.split('|'),p=c.people.find(x=>x.id===z);p.docs[k].status=p.docs[k].status==='var'?'yok':'var';saveData();render()});document.querySelectorAll('[data-pd]').forEach(i=>i.onchange=()=>{let[z,k]=i.dataset.pd.split('|'),p=c.people.find(x=>x.id===z);p.docs[k].expiry=i.value;if(i.value)p.docs[k].status='var';saveData();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Personel silinsin mi?')){c.people=c.people.filter(x=>x.id!==b.dataset.del);saveData();render()}})}function open(m){mode=m;$('#modalTitle').textContent=m==='company'?'Yeni Taşeron Firma':'Yeni Personel';$('#modalInput').value='';$('#modal').classList.remove('hidden');setTimeout(()=>$('#modalInput').focus(),50)}$('#addCompany').onclick=()=>open('company');$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#save').onclick=()=>{let v=$('#modalInput').value.trim();if(!v)return;if(mode==='company'){let c=mk(v.toLocaleUpperCase('tr'));data[entity].push(c);active=c.id}else{let c=data[entity].find(x=>x.id===active);if(c)c.people.push({id:id(),name:v,docs:empty(P)})}saveData();$('#modal').classList.add('hidden');render()};$('#modalInput').onkeydown=e=>{if(e.key==='Enter')$('#save').click()};render()})();</script></body></html>
